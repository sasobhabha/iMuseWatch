name: iMuseWatch
options:
  bundleIdPrefix: com.shashwath
  deploymentTarget:
    watchOS: "10.0"
settings:
  SWIFT_VERSION: "5.0"
  ENABLE_USER_SCRIPT_SANDBOXING: false
  DEVELOPMENT_TEAM: ZX32KR6KKW
targets:
  iMuseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: iMuseWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shashwath.iMuseWatch
      DEVELOPMENT_TEAM: ZX32KR6KKW
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      INFOPLIST_FILE: iMuseWatch/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  iMuseWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: iMuseWatchTests
    dependencies:
      - target: iMuseWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shashwath.iMuseWatchTests
      DEVELOPMENT_TEAM: ZX32KR6KKW
      CODE_SIGN_STYLE: Automatic
